[project]
name = "perigee-api"
version = "0.1.0"
description = "Перигей — приватное PWA для планирования свиданий (бэкенд)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    # Passkeys: проверка регистрации и входа WebAuthn на стороне сервера.
    "webauthn>=3.0.0",
    # Подпись access-токенов сессии.
    "pyjwt>=2.9.0",
    # Argon2id для хэшей инвайт-кодов и кодов восстановления (ТЗ 9.7).
    "argon2-cffi>=23.1.0",
    # Web-push напрямую в push-сервисы браузеров, без Firebase (ТЗ 13.1).
    "pywebpush>=2.0.0",
    # Напоминания за сутки и за 2 часа (ТЗ 13.5).
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13.0",
    "ruff>=0.7.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# disallow_any_explicit намеренно не включён: плагин pydantic синтезирует
# __init__ моделей с Any, и флаг ругался бы на каждый класс-схему, а не на наш код.
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# alembic-скрипты генерируются шаблоном и не аннотируются полностью.
module = "alembic.*"
ignore_errors = true

[[tool.mypy.overrides]]
# pywebpush и apscheduler не поставляют типы (нет py.typed). Свой код
# при этом остаётся под strict — отключаем только проверку их импортов.
module = ["pywebpush.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "ASYNC"]
