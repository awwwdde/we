# Локальная разработка: Postgres + API (uvicorn --reload) + Vite dev-server.
#
# В проде состав другой: платформа awwwdde поднимает один контейнер из
# корневого Dockerfile (фронт внутри) и свой Postgres. См. DEPLOY.md.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Внутри compose-сети Postgres доступен по имени сервиса.
      # Формат без драйвера — ровно как отдаёт панель на проде (см. config.py).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PUBLIC_SITE_URL: http://localhost:5173
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    volumes:
      - ./web:/app
      - webnodemodules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  pgdata:
  webnodemodules:
